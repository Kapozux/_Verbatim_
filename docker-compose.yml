services:
  verbatim:
    build: .
    image: verbatim
    ports:
      - "5001:5001"
    # API keys / token / options — copy .env.example to .env and fill it in.
    env_file:
      - .env
    # Persist transcripts, audio, and task state across restarts.
    volumes:
      - ./data/results:/app/getAudio/results
      - ./data/uploads:/app/getAudio/uploads
    restart: unless-stopped
